[package]
name = "modem2sip"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Expose an LTE modem (ModemManager + ALSA) as a SIP endpoint: voice, SMS and MMS"
license = "MIT"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
    "fs",
    "process",
] }
futures-util = "0.3"

# ModemManager control (D-Bus). No AT commands anywhere in this crate.
zbus = { version = "4", default-features = false, features = ["tokio"] }
zvariant = "4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

rusqlite = { version = "0.31" }

# Voice path: the ALSA card exposed by the modem.
alsa = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "1"

md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"

[features]
# Compile SQLite from source.  Convenient on a workstation; distributions
# and OpenWrt build with --no-default-features and link the system library.
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[profile.release]
opt-level = 2
lto = "thin"
